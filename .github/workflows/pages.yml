name: daily-refresh-and-deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Daily: extend the committed sleeve history (Nasdaq for stocks/ETFs, Binance for crypto),
      # refresh quotes, and re-estimate the frontier. If a source is unreachable the committed
      # history is used as-is, so the deploy never depends on a third-party endpoint.
      - name: Refresh sleeves
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 8
        run: pnpm sleeves
      - name: Rebuild frontier
        if: github.event_name != 'push'
        run: pnpm frontier

      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
