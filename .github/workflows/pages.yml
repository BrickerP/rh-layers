name: daily-refresh-and-deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Cloud refresh. If a source is unreachable from the runner, the committed
      # run artifact is used instead and the deploy still succeeds.
      - name: Discover universe
        continue-on-error: true
        run: pnpm discover
      - name: Fetch history
        continue-on-error: true
        timeout-minutes: 25
        run: pnpm fetch:broad
      - name: Run pipeline
        continue-on-error: true
        run: pnpm pipeline
      - name: Sync run artifact
        run: pnpm --filter @rh-layers/web sync

      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
